name: Release

# Runs when a v* tag is pushed, or by hand on a tag (Actions, Run workflow, pick the tag in "Use workflow from").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Work out the version from the tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Run this workflow on a tag like v0.2.0 (got '${GITHUB_REF_NAME}')." >&2
            exit 1
          fi
          # Only commits that reached main can be released.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Privacy guard
        shell: bash
        run: scripts/privacy-guard.sh

      - name: Fetch the face model
        shell: bash
        run: scripts/fetch-pose-model.sh

      - name: Format
        run: dotnet format Sway.sln --verify-no-changes

      - name: Build
        run: dotnet build Sway.sln --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Sway.sln --configuration Release --no-build

      - name: Publish the app (self-contained, so no .NET install is needed)
        run: dotnet publish src/Sway.App/Sway.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} --output artifacts/Gander

      - name: Add the notices and install notes
        shell: bash
        run: |
          cp THIRD-PARTY-NOTICES.md artifacts/Gander/
          cp docs/INSTALL.md artifacts/Gander/INSTALL.md
          test -f artifacts/Gander/Gander.exe
          test -f artifacts/Gander/models/face_landmark.onnx

      - name: Privacy audit of the published folder
        shell: bash
        run: |
          if [[ -f scripts/audit-privacy.sh ]]; then scripts/audit-privacy.sh artifacts/Gander; else echo "audit script not present yet"; fi

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=..\artifacts\Gander" installer\Sway.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $name = "Gander-${{ steps.version.outputs.version }}-win-x64-setup.exe"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "artifacts/$name.sha256"

      - name: Zip and checksum
        shell: pwsh
        run: |
          $name = "Gander-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path artifacts/Gander -DestinationPath "artifacts/$name"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "artifacts/$name.sha256"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes="Unsigned build. Windows SmartScreen will warn the first time: choose More info, then Run anyway. Installer (Gander-...-setup.exe) or portable zip; see INSTALL.md inside the zip. Verify the download against the .sha256 file."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite its files." >&2
            exit 1
          else
            gh release create "$tag" artifacts/Gander-*.zip artifacts/Gander-*.zip.sha256 artifacts/Gander-*-setup.exe artifacts/Gander-*-setup.exe.sha256 --title "Gander for Windows $tag" --notes "$notes" --prerelease
          fi
