name: CI

# Pull requests only (PLAN.md section 8): Windows minutes bill at 2x on a private repo.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Privacy guard (no networking, image persistence or input events)
        shell: bash
        run: scripts/privacy-guard.sh

      # Development-time download of the pinned, checksum-verified face model (the shipped program has no network code).
      - name: Fetch the face model
        shell: bash
        run: scripts/fetch-pose-model.sh

      - name: Format
        run: dotnet format Sway.sln --verify-no-changes

      - name: Build (warnings are errors)
        run: dotnet build Sway.sln --configuration Release

      - name: Test
        run: dotnet test Sway.sln --configuration Release --no-build

      # The downloads the user tries on the Windows desktop. Self-contained, so no .NET install is needed there.
      - name: Publish the app
        run: dotnet publish src/Sway.App/Sway.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/app

      - name: Build the installer (compile check)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=0.0.0-ci" "/DSourceDir=..\artifacts\app" installer\Sway.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $name = "Sway-0.0.0-ci-win-x64-setup.exe"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "artifacts/$name.sha256"

      - name: Publish the spike tools
        run: dotnet publish src/Sway.Tools/Sway.Tools.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/tools

      - name: Upload the app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sway-win-x64
          path: artifacts/app
          retention-days: 14

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sway-setup-win-x64
          path: artifacts/Sway-0.0.0-ci-win-x64-setup.exe
          retention-days: 14

      - name: Upload the spike tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SwayTools-win-x64
          path: artifacts/tools
          retention-days: 14
