name: CI

# Pull requests only (PLAN.md section 8): Windows minutes bill at 2x on a private repo.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Privacy guard (no networking, image persistence or input events)
        shell: bash
        run: scripts/privacy-guard.sh

      # Development-time download of the pinned, checksum-verified face model (the shipped program has no network code).
      - name: Fetch the face model
        shell: bash
        run: scripts/fetch-pose-model.sh

      - name: Format
        run: dotnet format Gander.sln --verify-no-changes

      - name: Build (warnings are errors)
        run: dotnet build Gander.sln --configuration Release

      # The window render tests also save each page of the Gander window as a PNG here.
      - name: Test
        run: dotnet test Gander.sln --configuration Release --no-build
        env:
          GANDER_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots

      - name: Upload the window screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14

      # The downloads the user tries on the Windows desktop. Self-contained, so no .NET install is needed there.
      - name: Publish the app
        run: dotnet publish src/Gander.App/Gander.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/app

      - name: Build the installer (compile check)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=0.0.0-ci" "/DSourceDir=..\artifacts\app" installer\Gander.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $name = "Gander-0.0.0-ci-win-x64-setup.exe"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "artifacts/$name.sha256"

      - name: Publish the spike tools
        run: dotnet publish src/Gander.Tools/Gander.Tools.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output artifacts/tools

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gander-win-x64
          path: artifacts/app
          retention-days: 14

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gander-setup-win-x64
          path: artifacts/Gander-0.0.0-ci-win-x64-setup.exe
          retention-days: 14

      - name: Upload the spike tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GanderTools-win-x64
          path: artifacts/tools
          retention-days: 14
