name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of "Copy diagnostics" in Settings, once it exists.
